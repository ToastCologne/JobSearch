# Job Search Bot Configuration — Legal & Finance Focus

search:
  # Job titles / keywords to search for
  queries:
    - "Legal Counsel"
    - "In-house Counsel"
    - "Lawyer"
    - "Associate Lawyer"
    - "Legal Advisor"
    - "Corporate Counsel"
    - "Compliance Counsel"
    - "Documentation Specialist"
    - "Legal Documentation"
    - "Contract Counsel"

  # Location (city, country, or "Remote")
  location: "Luxembourg"

  # Include remote jobs
  remote: true

  # Salary filters (leave null to disable)
  salary_min: null
  salary_max: null

  # Which job sites to scrape
  sites:
    linkedin: true
    indeed: true
    glassdoor: true

  # Banking & finance company career pages
  company_pages:
    - name: "Goldman Sachs"
      url: "https://www.goldmansachs.com/careers/search#ss=Legal"
    - name: "JPMorgan Chase"
      url: "https://careers.jpmorgan.com/us/en/jobs?search=legal+counsel&category=Legal"
    - name: "Barclays"
      url: "https://search.jobs.barclays/search-jobs/legal/united-kingdom/22546/1/2/6269131/51x5-0/-0x12667/50/2"
    - name: "HSBC"
      url: "https://mycareer.hsbc.com/en_GB/ext/Search.html?jobFamily=Legal%2C+Compliance+%26+Regulatory"
    - name: "Deutsche Bank"
      url: "https://careers.db.com/professionals/search-roles/#/professional/results?keywords=legal+counsel"
    - name: "Citi"
      url: "https://jobs.citi.com/search-jobs/legal/287/1"
    - name: "UBS"
      url: "https://www.ubs.com/global/en/careers/job-search.html#q=legal+counsel&t=1"
    - name: "Morgan Stanley"
      url: "https://www.morganstanley.com/careers/search-jobs?keyword=legal&department=Legal"
    - name: "BNP Paribas"
      url: "https://group.bnpparibas/en/careers/job-offers?keywords=legal+counsel&country=United+Kingdom"
    - name: "Standard Chartered"
      url: "https://scb.taleo.net/careersection/ex/jobsearch.ftl?lang=en&keyword=legal+counsel"
    - name: "Lloyds Banking Group"
      url: "https://www.lloydsbankinggroup.com/careers/opportunities.html?keywords=legal+counsel"
    - name: "NatWest Group"
      url: "https://jobs.natwestgroup.com/jobs/?keywords=legal+counsel"
    - name: "BlackRock"
      url: "https://careers.blackrock.com/job-search-results/?keyword=legal+counsel"
    - name: "Societe Generale"
      url: "https://careers.societegenerale.com/en/job-offers?keywords=legal+counsel&country=United+Kingdom"
    - name: "Credit Agricole"
      url: "https://www.credit-agricole.com/en/career/job-offers?q=legal+counsel"

matching:
  # Job TITLE must contain at least one of these (OR logic).
  # Jobs whose title has none of these words are silently dropped.
  required_title_keywords:
    - "legal"
    - "lawyer"
    - "counsel"
    - "documentation"

  # Job TITLE must NOT contain any of these words — matching jobs are dropped.
  excluded_title_keywords:
    - "junior"

  # Optional: ALL of these must appear somewhere in the full job text (title +
  # description). Leave the list empty to disable.
  required_keywords: []

  # Optional: if ANY of these appear in the full job text the job is dropped.
  excluded_keywords: []

  # Language exclusion: jobs that list these as required languages are dropped.
  exclude_languages:
    - "French"
    - "German"
    - "Luxembourgish"

scheduler:
  # Run scraping automatically on a schedule
  enabled: false
  # Cron expression: default = weekdays at 9am
  cron: "0 9 * * 1-5"

dashboard:
  host: "127.0.0.1"
  port: 8000
