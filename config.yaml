# Legal Job Scraper — Configuration
#
# HOW TO ADD COMPANY PAGES
# ─────────────────────────
# Provide the URL of the *search results page* with all filters already applied
# (location = Luxembourg, category = Legal / Counsel etc.).
# The scraper re-visits that exact URL every time you run a scrape, so any
# filters baked into the URL are applied automatically.
#
# Good example:
#   url: "https://careers.jpmorgan.com/us/en/jobs?search=legal+counsel&location=Luxembourg"
#
# The scraper then follows each individual job link it finds on that page,
# reads the real job title from the <h1>, extracts the location, and saves
# the description — so what you see in the dashboard is the true job data,
# not link anchor text.

search:
  # These are only used by LinkedIn / Indeed / Glassdoor (all disabled below).
  # They have no effect on company-page scraping.
  queries:
    - "Legal Counsel"
    - "Lawyer"
    - "Counsel"
    - "Documentation Specialist"

  location: "Luxembourg"
  remote: false

  # Job boards — disabled while you configure company pages
  sites:
    linkedin: false
    indeed: false
    glassdoor: false

  # ── Add your company career-search URLs below ──────────────────────────────
  # Each entry needs a display name and the pre-filtered search results URL.
  # Remove or comment out entries you don't want.
  company_pages: []
  #   - name: "JPMorgan Chase"
  #     url: "https://careers.jpmorgan.com/us/en/jobs?search=legal+counsel&location=Luxembourg"
  #   - name: "Goldman Sachs"
  #     url: "https://www.goldmansachs.com/careers/search?ss=Legal&location=Luxembourg"
  #   - name: "Deutsche Bank"
  #     url: "https://careers.db.com/professionals/search-roles/#/professional/results?keywords=legal+counsel&location=Luxembourg"
  #   - name: "BNP Paribas"
  #     url: "https://group.bnpparibas/en/careers/job-offers?keywords=legal+counsel&country=Luxembourg"

matching:
  # Job TITLE must contain at least one of these (OR logic).
  # A job whose title contains none of these is dropped.
  required_title_keywords:
    - "legal"
    - "lawyer"
    - "counsel"
    - "documentation"

  # Job TITLE must NOT contain any of these (case-insensitive).
  excluded_title_keywords:
    - "junior"
    - "notice"
    - "disclaimer"
    - "policy"

  # Optional full-text filters (title + description).
  required_keywords: []   # ALL must be present — leave empty to disable
  excluded_keywords: []   # ANY match drops the job — leave empty to disable

  # Language exclusion: jobs that list these as required languages are dropped.
  exclude_languages:
    - "French"
    - "German"
    - "Luxembourgish"

scheduler:
  enabled: false
  cron: "0 9 * * 1-5"   # weekdays at 9 am

dashboard:
  host: "127.0.0.1"
  port: 8000
