<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Search Bot{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-robot me-2"></i>Job Search Bot
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Dashboard</a>
            <a class="nav-link" href="/jobs"><i class="bi bi-briefcase me-1"></i>Jobs</a>
        </div>
    </div>
</nav>

<div class="container-fluid py-4">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Poll for background task completion and reload when done
function pollStatus(url, intervalMs, onDone) {
    const interval = setInterval(async () => {
        const res = await fetch(url);
        const data = await res.json();
        if (data.status && data.status !== 'running' && data.status !== 'idle') {
            clearInterval(interval);
            onDone(data.status);
        }
    }, intervalMs);
}

function pollScrape(intervalMs) {
    const interval = setInterval(async () => {
        const res = await fetch('/scrape-status');
        const data = await res.json();
        if (!data.running) {
            clearInterval(interval);
            location.reload();
        }
    }, intervalMs);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
